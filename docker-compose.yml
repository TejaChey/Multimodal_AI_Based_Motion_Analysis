# docker compose up --build   (expects ./artifacts with a trained champion: `dvc repro`)
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: {WORKERS: "2"}
    volumes: ["${ARTIFACTS_DIR:-./artifacts}:/data"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
  worker:            # drift monitor + automated retraining loop (shares the feature store); metrics on :9101
    build: {context: ., target: worker}
    command: ["python", "-m", "sprintml.cli", "loop", "--interval", "60"]
    environment: {SPRINTML_WEBHOOK_URL: "${SPRINTML_WEBHOOK_URL:-}", PYTHONUNBUFFERED: "1", GIT_PYTHON_REFRESH: quiet}
    volumes: ["${ARTIFACTS_DIR:-./artifacts}:/data"]
    restart: always
    healthcheck: {disable: true}
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api, worker]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
