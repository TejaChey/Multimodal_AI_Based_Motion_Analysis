name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-ci.txt
      # real-data regression tests skip themselves when the raw recordings are absent (they are not in git)
      - run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sprintml-api .
      - name: smoke test (boots; no champion yet => 503 no_model)
        run: |
          docker run -d --name api -p 8000:8000 sprintml-api
          for i in $(seq 1 30); do curl -s localhost:8000/health && break; sleep 2; done
          curl -s localhost:8000/health | grep -q no_model
          curl -s localhost:8000/metrics | grep -q sprintml_requests_total
